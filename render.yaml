# Render Blueprint — deploys the app as a free web service.
# Render dashboard -> New -> Blueprint -> pick your GitHub repo.
services:
  - type: web
    name: agentverse-website
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Optional. Leave unset for demo mode; add it in the Render dashboard for real AI replies.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
