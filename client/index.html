<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AgentVerse — pre-made AI agents, multi-agent workflows and a custom agent builder." />
    <meta name="theme-color" content="#0b0c10" />
    <title>AgentVerse | AI Agent Platform</title>
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong one.
      try {
        var t = JSON.parse(localStorage.getItem('agentverse.theme') || '"dark"');
        document.documentElement.classList.toggle('dark', t !== 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
