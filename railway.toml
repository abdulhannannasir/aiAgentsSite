# Railway config-as-code. Railway auto-detects Node; this makes sure the front end is built first.
[build]
buildCommand = "npm ci --include=dev && npm run build"

[deploy]
# Applies database migrations when DATABASE_URL is set; does nothing in guest mode.
preDeployCommand = "npm run release"
startCommand = "npm start"
healthcheckPath = "/healthz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
